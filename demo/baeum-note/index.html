<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>체험판 · 배움 노트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
/* 업무 상황판과 같은 톤: 흰 바탕, 12px, 번호 인덱스, 가는 줄, 회색 보조 글씨, 상태 색 점 */
:root{
  --ink:rgba(0,0,0,.85); --soft:rgba(0,0,0,.45); --faint:rgba(0,0,0,.12); --hover:rgba(0,0,0,.04); --bg:#fff;
  --done:#68D27C; --doing:#FFA45B; --plan:#4A90E2; --check:#FF5C5F; --post:#D75DE7;
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:12px/1.5 var(--font);color:var(--ink);background:var(--bg);letter-spacing:-.005em}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
.n{color:var(--soft)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--faint)}
.label{color:var(--soft);margin:0 0 6px}

header{display:grid;grid-template-columns:22% 1fr 30%;gap:0 20px;padding:12px 16px 10px;border-bottom:1px solid var(--faint);
  position:sticky;top:0;background:var(--bg);z-index:5}
header .r{display:flex;justify-content:space-between;gap:12px}
.tabs button{color:var(--soft);margin-right:12px}
.tabs button.on{color:var(--ink);text-decoration:underline;text-underline-offset:3px}

.app{display:grid;grid-template-columns:22% 1fr 30%;gap:0 20px;padding:14px 16px 40px;align-items:start}
aside,.panel{position:sticky;top:52px;max-height:calc(100vh - 66px);overflow:auto}

/* 왼쪽: 회차 인덱스 */
.idx{display:grid;grid-template-columns:28px 1fr auto;row-gap:1px;margin-bottom:22px}
.idx > *{padding:1px 0}
.idx .it{cursor:pointer}
.idx .it:hover,.idx .it.on{text-decoration:underline;text-underline-offset:3px}
.idx .it.done{color:var(--soft)}
.bars{display:grid;grid-template-columns:70px 1fr 34px;gap:5px 8px;align-items:center;margin-bottom:22px}
.meter{height:2px;background:var(--faint)}
.meter i{display:block;height:100%;background:var(--ink)}

/* 가운데: 실습 표 */
.head{display:flex;justify-content:space-between;margin-bottom:8px}
.rows{border-top:1px solid var(--faint)}
.row{display:grid;grid-template-columns:34px 1fr 90px 70px;gap:10px;padding:7px 0;border-bottom:1px solid var(--faint);cursor:pointer;align-items:baseline}
.row:hover{background:var(--hover)}
.row.sel{background:var(--hover)}
.row.done .t{color:var(--soft)}
.row .sub{grid-column:2/-1;color:var(--soft);font-size:11px;margin-top:-2px}
.legend{margin-top:10px;color:var(--soft)}
.legend span{margin-right:14px}
.block{margin-top:34px}

/* 오른쪽: 상세 */
.panel h2{font-size:12px;font-weight:600;margin:0 0 2px}
.panel .meta{color:var(--soft);margin-bottom:12px}
.kv{display:grid;grid-template-columns:70px 1fr;gap:2px 10px;margin-bottom:6px}
.kv > div:nth-child(odd){color:var(--soft)}
.goal{margin:10px 0 4px}
.goal p{margin:0 0 6px}
.sec{margin-top:14px;padding-top:6px;border-top:1px solid var(--faint)}
.sec > .t{display:flex;justify-content:space-between;margin-bottom:4px;cursor:pointer}
.sec > .t span:first-child{font-weight:600}
.item{border-bottom:1px solid var(--faint)}
.item > .line{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:4px 0;cursor:pointer;text-decoration:none}
.item > .line:hover{background:var(--hover)}
.md{padding:4px 0 10px}
.md p{margin:3px 0}.md ul,.md ol{margin:3px 0;padding-left:16px}.md li{margin:2px 0}
.md code{background:#f2f2f2;padding:0 3px;border-radius:3px;font-size:11px}
.md table{border-collapse:collapse;width:100%}.md td,.md th{border-bottom:1px solid var(--faint);padding:2px 4px;text-align:left;font-size:11px}
.md h1,.md h2,.md h3{font-size:12px;margin:10px 0 3px}
.md blockquote{margin:4px 0;padding-left:8px;border-left:2px solid var(--faint);color:var(--soft)}
.hint{color:var(--soft);margin:6px 0}
.box{border:1px solid var(--faint);border-radius:6px;padding:6px 8px;color:var(--soft);margin:8px 0}
video{display:block;max-width:100%;max-height:52vh;margin:6px 0;background:#000;border-radius:4px}
.chk div{margin:1px 0}
.toc .vh{display:flex;justify-content:space-between;margin:10px 0 2px;font-weight:bold}
.toc .tr{display:grid;grid-template-columns:52px 1fr;gap:0 8px;padding:4px 0;border-bottom:1px solid var(--faint)}
.toc .tt{font-variant-numeric:tabular-nums;font-weight:bold}
.toc .td{color:var(--soft)}
.toc .rec{color:var(--soft);font-size:10px}
.toc .mat{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px;margin-top:4px}
.toc .chip{font-size:10px;border:1px solid var(--faint);border-radius:4px;padding:1px 6px;color:inherit;text-decoration:none;cursor:pointer;background:none}
.toc .chip:hover{border-color:currentColor}
.toc .thumbs{display:flex;gap:4px;flex-wrap:wrap}
.toc .thumbs a{display:block;line-height:0;border:1px solid var(--faint);border-radius:3px;overflow:hidden}
.toc .thumbs canvas{width:96px;height:auto;display:block;background:var(--faint)}

@media (max-width:980px){
  header,.app{grid-template-columns:1fr}
  aside,.panel{position:static;max-height:none}
}
</style>
</head>
<body>
<header>
  <div><b>배움 노트</b> <span class="n">· 04_LEARN</span> <span class="n" style="background:#C4C99B;color:#36382B;padding:1px 8px;border-radius:3px;margin-left:6px">체험판 · 내용은 모두 예시</span></div>
  <div class="r"><span class="tabs" id="tabs"></span><span class="n" id="summary"></span></div>
  <div class="r"><span class="n" id="school"></span><span class="n" id="clock"></span></div>
</header>

<div class="app">
  <aside id="side"></aside>
  <main id="main"></main>
  <section class="panel" id="panel"></section>
</div>

<script>
// 데이터: /api/course — 과정별 course.md · practice.md 와 연결된 자료. 옵시디언에서 고치고 돌아오면 다시 읽는다.
let RAW = null, DATA = null, SEL = null;
let CUR = (() => { try { return localStorage.getItem("demo-course") || "sf"; } catch(_) { return "sf"; } })();
const OPEN = new Map();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const done = v => v === "✓";
const WD = ["일","월","화","수","목","금","토"];
const fmt = s => /^\d{4}-\d{2}-\d{2}$/.test(s||"") ? `${s.slice(5,7)}.${s.slice(8,10)} ${WD[new Date(s+"T00:00:00").getDay()]}` : (s || "—");
const docsOf = (s, k) => s.docs.filter(d => d.kind === k);
const WATCH = () => DATA.meta.watch_label || "영상 시청";
const plain = t => (t||"").replace(/\[\[([^\]|]+?)(?:\|([^\]]+))?\]\]/g, (_, a, b) => b || a);
function obsidianToMd(t){
  return t.replace(/^---\n[\s\S]*?\n---\n/, "")
    .replace(/!\[\[([^\]|]+?)(?:\|[^\]]*)?\]\]/g, (_, n) => /\.(png|jpe?g|gif|webp)$/i.test(n) ? `![](/attach?n=${encodeURIComponent(n)})` : `\`${n}\``)
    .replace(/\[\[([^\]|]+?)\|([^\]]+?)\]\]/g, "$2").replace(/\[\[([^\]]+?)\]\]/g, "$1")
    .replace(/==([^=\n]+)==/g, "<mark>$1</mark>");
}
const render = t => marked.parse(obsidianToMd(t || ""), {gfm:true});

/* 단계·상태 */
function stage(s){
  if (docsOf(s,"review").length) return "복습 완료";
  if (docsOf(s,"transcript").length) return "복습 대기";
  if (done(s.watched)) return "메모 대기";
  if (s.date > DATA.today) return "예정";
  return "복습 전";
}
const STATUS_COLOR = {"완료":"var(--done)","게시":"var(--post)","진행 중":"var(--doing)","예정":"var(--plan)","확인 필요":"var(--check)"};
const isDone = p => ["완료","게시"].includes(p.status);
const dot = st => `<span class="dot" style="background:${STATUS_COLOR[st] || "var(--faint)"}"></span>`;

/* ── 왼쪽: 회차 인덱스 · 진행 · 정보 ── */
function drawSide(){
  const ss = DATA.sessions, ps = DATA.practice;
  const hw = ss.filter(s => s.homework !== "없음"), fb = ss.filter(s => s.feedback !== "없음"), at = ss.filter(s => s.watched !== "없음");
  const bar = (l, n, t) => `<span class="n">${l}</span><div class="meter"><i style="width:${t ? n/t*100 : 0}%"></i></div><span class="n">${n}/${t}</span>`;
  $("#side").innerHTML = `
    <div class="label">Lectures</div>
    <div class="idx">${ss.map(s => { const st = stage(s);
      return `<span class="n">${s.id}.</span><span class="it ${SEL==="s:"+s.id?"on":""} ${st==="복습 완료"?"done":""}" data-s="${s.id}">${esc(s.title)}</span><span class="n">${fmt(s.date).slice(0,5)}</span>`; }).join("")}</div>
    <div class="label">Progress</div>
    <div class="bars">
      ${bar(WATCH(), at.filter(s=>done(s.watched)).length, at.length)}
      ${bar("과제 제출", hw.filter(s=>done(s.homework)).length, hw.length)}
      ${bar("피드백", fb.filter(s=>done(s.feedback)).length, fb.length)}
      ${bar("복습 노트", ss.filter(s=>docsOf(s,"review").length).length, ss.length)}
      ${bar("실습 완료", ps.filter(isDone).length, ps.length)}
    </div>
    <div class="label">Info</div>
    <div class="idx">
      <span class="n">01.</span><span class="it ${SEL==="info"?"on":""}" data-info>과정 정보 · 고민 중</span><span></span>
      <span class="n">02.</span><span class="n">노트</span><span></span>
      <span></span><span class="n" style="grid-column:2/-1">${esc(DATA.notesDir)}</span>
      <span class="n">03.</span><span class="n">원본 (읽기만)</span><span></span>
      <span></span><span class="n" style="grid-column:2/-1">${esc(DATA.origDir || "")}</span>
    </div>`;
}

/* ── 가운데: 실습 · 다음 회차 · 할 일 ── */
function drawMain(){
  const ps = DATA.practice, ss = DATA.sessions;
  const next = ss.filter(s => s.date >= DATA.today).slice(0, 3);
  const todo = ps.filter(p => !isDone(p));
  $("#main").innerHTML = `
    <div class="head"><b>Practice</b><span class="n">완료·게시 ${ps.filter(isDone).length} / ${ps.length} · 진행 중 ${ps.filter(p=>p.status==="진행 중").length}</span></div>
    <div class="rows">${ps.map(p => `<div class="row ${isDone(p)?"done":""} ${SEL==="p:"+p.id?"sel":""}" data-p="${p.id}">
      <span class="n">${p.id}.</span><span class="t">${esc(p.title)}</span><span>${dot(p.status)}${esc(p.status)}</span><span class="n">${fmt(p.date)}</span>
      ${!isDone(p) && p.next && p.next !== "—" ? `<span class="sub">다음 → ${esc(p.next)}</span>` : ""}</div>`).join("")}</div>
    <div class="legend">${Object.entries(STATUS_COLOR).map(([k,c]) => `<span><span class="dot" style="background:${c}"></span>${k}</span>`).join("")}</div>

    <div class="block">
      <div class="head"><b>Next sessions</b><span class="n">오늘 ${fmt(DATA.today)}</span></div>
      <div class="rows">${next.length ? next.map(s => `<div class="row" data-s="${s.id}"><span class="n">${s.id}.</span><span class="t">${esc(s.title)}</span>
        <span class="n">${stage(s)}</span><span class="n">${fmt(s.date)}</span>
        ${s.task && s.task !== "—" ? `<span class="sub">과제 · ${esc(s.task)}</span>` : ""}</div>`).join("") : `<div class="row"><span></span><span class="n">남은 회차 없음</span></div>`}</div>
    </div>

    <div class="block">
      <div class="head"><b>To do</b><span class="n">끝나지 않은 실습 ${todo.length}</span></div>
      <div class="rows">${todo.map(p => `<div class="row" data-p="${p.id}"><span class="n">${p.id}.</span><span class="t">${esc(p.next && p.next !== "—" ? p.next : p.title)}</span><span>${dot(p.status)}${esc(p.status)}</span><span class="n">${esc(p.session || "")}</span></div>`).join("")}</div>
    </div>`;
}

/* ── 오른쪽: 상세 ── */
const sec = (title, right, body, open = true) => `<div class="sec"><div class="t" data-toggle><span>${title}</span><span class="n">${right ?? ""} ${open?"–":"+"}</span></div><div ${open?"":"hidden"}>${body}</div></div>`;
const check = (ok, label) => `<div class="${ok?"":"n"}">${ok?"☑":"☐"} ${label}</div>`;
function docRows(list){
  return list.map(d => { const open = OPEN.get(d.path);
    return `<div class="item" data-path="${esc(d.path)}"><div class="line"><span>${esc(d.name)}</span><span class="n">${d.source==="orig"?"원본 · ":""}${d.chars.toLocaleString()}자</span><span class="n">${open?"접기":"펼치기"}</span></div>
      ${open ? `<div class="md">${render(d.text)}</div>` : ""}</div>`; }).join("");
}
function fileRows(list){
  return list.map(r => { const url = `/vault?p=${encodeURIComponent(r.path)}`;
    const label = `${esc(r.name)}${r.desc ? ` <span class="n">— ${esc(r.desc)}</span>` : ""}`;
    if (r.type === "영상") return `<div class="item"><div class="line" style="cursor:default"><span>${label}</span><span class="n">영상</span><span></span></div><video controls preload="metadata" src="${url}"></video></div>`;
    return r.openable ? `<div class="item"><a class="line" href="${url}" target="_blank"><span>${label}</span><span class="n">${r.source==="orig"?"원본 · ":""}${esc(r.type)}</span><span class="n">열기 ↗</span></a></div>`
      : `<div class="item"><div class="line" style="cursor:default"><span>${label}</span><span class="n">${esc(r.type)}</span><span></span></div></div>`; }).join("");
}
/* 영상 목차: `S{n} 영상 목차` md의 '## (영상) · 길이' + 표(영상 시각 | 녹화 시각 | 주제 | 내용)를 읽어 바로 보여준다 */
const isToc = d => /영상 목차/.test(d.name);
/* 자료 칸: '파일 이름 · p.3-7' → 회차의 강의 자료(PDF는 해당 쪽 링크 + 그림, 문서는 강의 자료 칸에서 펼치기) */
function matHtml(m, s){
  if (!m) return "";
  const [name, pg] = m.split(" · ");
  const f = s.readings.find(x => x.name.startsWith(name.trim()));
  const d = !f && s.docs.find(x => x.name.startsWith(name.trim()));
  let label = (f || d) ? (f || d).name.split(" — ")[0] : name;
  if (f && /^\d+$/.test(label)) label = f.desc || label;
  if (f && /^p\.(\d+)(?:-(\d+))?$/.test(pg || "")){
    const [, a, b] = pg.match(/^p\.(\d+)(?:-(\d+))?$/); const from = +a, to = +(b || a);
    const url = `/vault?p=${encodeURIComponent(f.path)}`;
    const pages = []; for (let i = from; i <= to && pages.length < 4; i++) pages.push(i);
    return `<div class="mat"><a class="chip" href="${url}#page=${from}" target="_blank">자료 · ${esc(label)} ${esc(pg)} ↗</a>
      <div class="thumbs">${pages.map(i => `<a href="${url}#page=${i}" target="_blank" title="${i}쪽"><canvas data-pdf="${url}" data-page="${i}"></canvas></a>`).join("")}${to - from + 1 > 4 ? `<span class="rec">+${to - from - 3}쪽</span>` : ""}</div></div>`;
  }
  if (f) return `<div class="mat"><a class="chip" href="/vault?p=${encodeURIComponent(f.path)}" target="_blank">자료 · ${esc(label)} ↗</a></div>`;
  if (d) return `<div class="mat"><button class="chip" type="button" data-doc="${esc(d.path)}">자료 · ${esc(label)} (아래 강의 자료에서 펼치기)</button></div>`;
  return `<div class="mat"><span class="chip">자료 · ${esc(m)}</span></div>`;
}
const PDFS = new Map();
async function drawThumbs(){
  if (!window.pdfjsLib) return;
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  for (const c of document.querySelectorAll("#panel canvas[data-pdf]:not([data-done])")){
    c.dataset.done = 1;
    try {
      if (!PDFS.has(c.dataset.pdf)) PDFS.set(c.dataset.pdf, pdfjsLib.getDocument(c.dataset.pdf).promise);
      const pdf = await PDFS.get(c.dataset.pdf), page = await pdf.getPage(+c.dataset.page);
      const vp0 = page.getViewport({scale:1}), vp = page.getViewport({scale: 192 / vp0.width});
      c.width = vp.width; c.height = vp.height;
      await page.render({canvasContext: c.getContext("2d"), viewport: vp}).promise;
    } catch (e) { c.replaceWith(Object.assign(document.createElement("span"), {className:"rec", textContent: c.dataset.page + "쪽"})); }
  }
}
function tocHtml(d, s){
  const out = []; let v = null;
  for (const line of (d.text || "").split(/\r?\n/)){
    const h = line.match(/^## (.+?) · ([\d:]+)\s*$/);
    if (h){ v = {name:h[1], len:h[2], rows:[]}; out.push(v); continue; }
    const r = line.match(/^\| *(\d[\d:]*) *\| *([^|]*?) *\| *([^|]*?) *\| *([^|]*?) *\|(?: *([^|]*?) *\|)?\s*$/);
    if (r && v) v.rows.push({t:r[1], rec:r[2], h:r[3], d:r[4], m:(r[5]||"").trim()});
  }
  return out.map(v => `<div class="vh"><span>영상 ${esc(v.name)}</span><span class="n">${esc(v.len)}</span></div>` +
    v.rows.map(r => `<div class="tr"><span class="tt">${esc(r.t)}</span><span><b>${esc(r.h)}</b> <span class="rec">· 녹화 ${esc(r.rec)}</span><div class="td">${esc(r.d)}</div>${matHtml(r.m, s)}</span></div>`).join("")).join("");
}
function panelSession(id){
  const s = DATA.sessions.find(x => x.id === id); if (!s) return;
  SEL = "s:" + id;
  const prep = docsOf(s,"prep"), memo = docsOf(s,"transcript"), rv = docsOf(s,"review");
  const toc = memo.filter(isToc), memoOnly = memo.filter(d => !isToc(d));
  const linked = DATA.practice.filter(p => p.session === s.id);
  $("#panel").innerHTML = `<h2>${s.id} · ${esc(s.title)}</h2>
    <div class="meta">${fmt(s.date)} · ${esc(s.lecturer)} · ${stage(s)}</div>
    <div class="kv"><div>체크</div><div class="chk">
      ${s.watched === "없음" ? "" : check(done(s.watched), WATCH())}
      ${s.homework === "없음" ? `<div class="n">· 과제 없음</div>` : check(done(s.homework), "과제 제출" + (s.task && s.task !== "—" ? " · " + esc(s.task) : ""))}
      ${s.feedback === "없음" ? "" : check(done(s.feedback), "피드백")}
      ${check(memo.length, "수업 메모")}${check(rv.length, "복습")}</div></div>
    <div class="goal">${s.goals.split(/\n\s*\n/).map(p => `<p>${esc(plain(p))}</p>`).join("")}</div>
    ${s.missing.length ? `<div class="box">원본 경로를 못 찾음: ${s.missing.map(esc).join(", ")}</div>` : ""}
    ${toc.length ? `<div class="toc">${sec("영상 목차 · 몇 분 몇 초에 무슨 내용", toc.reduce((n,d)=>n+(d.text.match(/^\| *\d/gm)||[]).length,0)+"곳", toc.map(d => tocHtml(d, s)).join("") + `<div class="hint">시각 = 강의실 영상 안 시각(±30초). 녹화 = 내 녹화 파일 안 시각. 자동 받아쓰기 초안</div>`)}</div>` : ""}
    ${linked.length ? sec("연결된 실습", linked.length, `<div class="rows">${linked.map(p => `<div class="row" data-p="${p.id}"><span class="n">${p.id}.</span><span class="t">${esc(p.title)}</span><span>${dot(p.status)}${esc(p.status)}</span><span></span></div>`).join("")}</div>`) : ""}
    ${sec("강의 자료", prep.length + s.readings.length, fileRows(s.readings) + docRows(prep) || `<div class="hint">연결된 자료 없음 · course.md 「원본 자료」에 경로를 적는다</div>`)}
    ${sec("수업 메모", memoOnly.length, docRows(memoOnly) || `<div class="hint">회차 폴더(강의복습/${s.id} - …/)에 이름에 '메모'가 들어간 md를 넣는다</div>`)}
    ${sec("복습", rv.length, docRows(rv) || `<div class="hint">엘에게 "${s.id} 복습 정리해줘"</div>`)}`;
  bindPanel(); drawSide(); drawMain();
}
function panelPractice(id){
  const p = DATA.practice.find(x => x.id === id); if (!p) return;
  SEL = "p:" + id;
  const s = DATA.sessions.find(x => x.id === p.session);
  $("#panel").innerHTML = `<h2>${p.id} · ${esc(p.title)}</h2>
    <div class="meta">${dot(p.status)}${esc(p.status)} · ${fmt(p.date)}</div>
    <div class="kv"><div>회차</div><div>${s ? `<a href="#" data-s="${s.id}">${s.id} · ${esc(s.title)}</a>` : "—"}</div>
      <div>다음</div><div>${esc(p.next || "—")}</div></div>
    <div class="goal"><p>${esc(plain(p.note))}</p></div>
    ${p.missing.length ? `<div class="box">경로를 못 찾음: ${p.missing.map(esc).join(", ")}</div>` : ""}
    ${p.docs.length + p.readings.length ? sec("자료", p.docs.length + p.readings.length, fileRows(p.readings) + docRows(p.docs)) : ""}`;
  bindPanel(); drawSide(); drawMain();
}
function panelInfo(){
  SEL = "info"; const m = DATA.meta;
  $("#panel").innerHTML = `<h2>${esc(m.title || DATA.name)}</h2><div class="meta">${esc(m.school || "")} · ${esc(m.cohort || "")}</div>
    <div class="kv"><div>형식</div><div>${esc(m.when || "")}</div><div>갱신</div><div>${esc(m.updated || "")}</div></div>
    <div class="goal"><p>${esc(plain(DATA.intro))}</p></div>
    ${DATA.pending ? sec("고민 중", "", `<div class="md">${render(DATA.pending)}</div>`) : ""}
    <div class="box">체험판이에요. 실제 배움 노트는 내 컴퓨터에서만 열리고, 옵시디언에 쓴 강의 기록을 그대로 읽어요. 여기 보이는 강의·과제·자료는 모두 예시로 바꿔 넣은 거예요.</div>`;
  bindPanel(); drawSide(); drawMain();
}
function bindPanel(){
  $("#panel").querySelectorAll("[data-doc]").forEach(b => b.onclick = () => {
    const box = [...$("#panel").querySelectorAll(".item[data-path]")].find(x => x.dataset.path === b.dataset.doc); if (!box) return;
    const body = box.closest(".sec > div"); if (body?.hidden) body.previousElementSibling.click();
    if (!box.querySelector(".md")) box.querySelector(".line").click();
    box.scrollIntoView({behavior:"smooth", block:"start"}); });
  drawThumbs();
  $("#panel").querySelectorAll("[data-toggle]").forEach(t => t.onclick = () => {
    const b = t.nextElementSibling; b.hidden = !b.hidden; const r = t.lastElementChild; r.textContent = r.textContent.replace(/[–+]$/, b.hidden ? "+" : "–"); });
  $("#panel").querySelectorAll(".item[data-path] > .line").forEach(l => l.onclick = () => {
    const box = l.parentElement, path = box.dataset.path;
    const d = [...DATA.sessions, ...DATA.practice].flatMap(x => x.docs).find(x => x.path === path);
    const open = !box.querySelector(".md"); OPEN.set(path, open);
    l.lastElementChild.textContent = open ? "접기" : "펼치기";
    if (open) box.insertAdjacentHTML("beforeend", `<div class="md">${render(d.text)}</div>`); else box.querySelector(".md").remove();
  });
}
function reopen(){
  if (SEL?.startsWith("s:")) return panelSession(SEL.slice(2));
  if (SEL?.startsWith("p:")) return panelPractice(SEL.slice(2));
  if (SEL === "info") return panelInfo();
  // 처음: 끝나지 않은 첫 실습, 없으면 다음 회차
  const p = DATA.practice.find(x => !isDone(x)); if (p) return panelPractice(p.id);
  const s = DATA.sessions.find(x => x.date >= DATA.today) || DATA.sessions[0]; panelSession(s.id);
}

document.addEventListener("click", e => {
  const c = e.target.closest("[data-course]");
  if (c && c.dataset.course !== CUR){ CUR = c.dataset.course; try { localStorage.setItem("demo-course", CUR); } catch(_){} SEL = null; OPEN.clear(); load(); return; }
  const s = e.target.closest("[data-s]"); if (s){ e.preventDefault(); panelSession(s.dataset.s); return; }
  const p = e.target.closest("[data-p]"); if (p){ panelPractice(p.dataset.p); return; }
  if (e.target.closest("[data-info]")) panelInfo();
});

function tick(){ $("#clock").textContent = new Date().toLocaleTimeString("ko-KR", {hour:"2-digit", minute:"2-digit"}); }
async function load(){
  RAW = await (await fetch("course.json", {cache:"no-store"})).json();
  if (RAW.error){ $("#main").innerHTML = `<p>${esc(RAW.error)}</p>`; return; }
  DATA = RAW.courses.find(c => c.id === CUR) || RAW.courses[0]; CUR = DATA.id; DATA.today = RAW.today;
  $("#tabs").innerHTML = RAW.courses.map(c => `<button class="${c.id===CUR?"on":""}" data-course="${c.id}">${esc(c.name)}</button>`).join("");
  const ss = DATA.sessions, ps = DATA.practice;
  $("#summary").textContent = `복습 ${ss.filter(s=>docsOf(s,"review").length).length}/${ss.length} · 실습 ${ps.filter(isDone).length}/${ps.length}`;
  $("#school").textContent = DATA.meta.school || "";
  drawSide(); drawMain(); reopen();
}
addEventListener("focus", () => load());
setInterval(tick, 10000); tick(); load();
</script>
</body>
</html>
