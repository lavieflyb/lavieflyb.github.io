<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>flyb · NARA</title>
<meta name="description" content="와인과 시가, 공간과 행사 곁에서 일하는 NARA가 가 본 곳과 만난 사람을 모아 두는 기록.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css?v=20261124b">
<style>
/* 첫 화면: 핸드폰 홈 화면처럼. 하늘색 바탕 + 시계·메모 위젯 + 앱 아이콘 + 아래 독.
   아이콘은 화면 위에 창으로 열리고, 창 안은 archive.html 의 해당 칸만 보여 준다.
   img/desktop.jpg 를 넣으면 바탕 사진이 된다. */
:root{--sky1:#4F8FE6;--sky2:#86B7F2;--sky3:#D6E7FA}
body.home{min-height:100svh;display:flex;flex-direction:column;align-items:center;color:#fff;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%) no-repeat,var(--sky2)}
body.home.has-photo{background:var(--sky2) url(img/desktop.jpg) center/cover no-repeat}
.status{width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px max(20px,env(safe-area-inset-left,0px)) 0;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.status .logo{font-size:17px;color:#fff;font-weight:700}
.status a{color:#fff}
.phone{width:min(100%,440px);flex:1;display:flex;flex-direction:column;padding:18px 20px calc(18px + env(safe-area-inset-bottom,0px));gap:26px}
/* 위젯 */
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.wd{border-radius:22px;padding:14px 16px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 24px rgba(20,40,80,.18)}
.wd.clock{background:rgba(255,255,255,.22);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.wd.clock .d{font-size:13px;font-weight:600;opacity:.95}
.wd.clock .t{font-size:44px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
.wd.clock .s{font-size:12px;opacity:.9}
.wd.memo{background:#FFF6C8;color:#3B3622}
.wd.memo .h{font-size:12px;font-weight:700;color:#B08A1E;letter-spacing:.02em}
.wd.memo p{margin:6px 0 0;font-family:var(--serif);font-size:15px;line-height:1.5}
/* 앱 아이콘 */
.apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px 10px}
.ic{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:#fff;border-radius:16px;padding:2px;cursor:pointer}
.ic[hidden]{display:none}
.ic svg{width:64px;height:64px;border-radius:16px;box-shadow:0 6px 14px rgba(20,40,80,.22);transition:transform .15s ease}
.ic span{font-size:11.5px;line-height:1.2;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.35);word-break:keep-all}
.ic:hover svg,.ic:focus-visible svg{transform:scale(1.06)}
.ic:active svg{transform:scale(.94)}
.ic:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* 독 */
.dock{margin-top:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:12px 14px;border-radius:30px;background:rgba(255,255,255,.28);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.dock .ic span{display:none}
.hint{text-align:center;font-size:12px;opacity:.9;margin:-8px 0 0}
.hint a{color:#fff}
/* 창 */
.win{position:fixed;z-index:5;left:50%;top:52%;transform:translate(-50%,-50%);width:min(760px,calc(100vw - 32px));height:min(78vh,720px);
  background:var(--bg);color:var(--ink);border-radius:16px;box-shadow:0 30px 80px rgba(10,25,60,.4);display:flex;flex-direction:column;overflow:hidden}
.win[hidden]{display:none}
.win .tb{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--paper);font-size:13px}
.win .tb button{all:unset;cursor:pointer;font-size:14px;color:var(--wine);padding:2px 4px}
.win .tb button:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.win .tb .t{flex:1;text-align:center;font-weight:600;color:var(--ink)}
.win .tb a{font-size:12px;color:var(--muted);white-space:nowrap}
.win iframe{flex:1;border:0;width:100%;background:var(--bg)}
.shade{position:fixed;inset:0;z-index:4;background:rgba(10,25,60,.25)}
.shade[hidden]{display:none}
@media (max-width:620px){
  .win{inset:0;left:0;top:0;transform:none;width:100%;height:100%;border-radius:0}
  .ic svg{width:58px;height:58px;border-radius:14px}
}
@media (prefers-reduced-motion:reduce){.ic svg{transition:none}}
</style>
</head>

<div class="shade" id="shade" hidden></div>
<div class="win" id="win" role="dialog" aria-modal="true" aria-labelledby="wintitle" hidden>
  <div class="tb"><button type="button" id="winclose">닫기</button><span class="t" id="wintitle"></span><a id="winfull" href="archive.html">전체 페이지 ↗</a></div>
  <iframe id="winframe" title="창 내용"></iframe>
</div>

<script>
// 바탕 사진: img/desktop.jpg 가 있을 때만
(() => { const i = new Image(); i.onload = () => document.body.classList.add("has-photo"); i.src = "img/desktop.jpg"; })();

// 시계 (상단 줄 + 위젯)
(() => {
  const s = document.getElementById("clock-s"), d = document.getElementById("w-date"), t = document.getElementById("w-time");
  const tick = () => {
    const n = new Date();
    const hm = n.toLocaleTimeString("ko-KR", {hour:"2-digit", minute:"2-digit", hour12:false});
    s.textContent = hm; t.textContent = hm;
    d.textContent = n.toLocaleDateString("ko-KR", {month:"long", day:"numeric", weekday:"short"});
  };
  tick(); setInterval(tick, 30000);
})();

// 앱 → 창
(() => {
  const win = document.getElementById("win"), shade = document.getElementById("shade"),
        frame = document.getElementById("winframe"), title = document.getElementById("wintitle"),
        full = document.getElementById("winfull"), close = document.getElementById("winclose");
  let opener = null;
  const open = (a) => {
    opener = a;
    const w = a.dataset.win;
    frame.src = w === "ai" ? "ai-system.html?embed=1" : "archive.html?only=" + w;
    full.href = a.getAttribute("href");
    title.textContent = a.dataset.title;
    win.hidden = false; shade.hidden = false; close.focus();
  };
  const shut = () => { win.hidden = true; shade.hidden = true; frame.src = "about:blank"; opener?.focus(); };
  // 내 노트북: 127.0.0.1로 열었거나 이 브라우저에서 한 번 ?me=1 로 열어 둔 경우 → 진짜 배움 노트
  const MINE = (() => { try { const q = new URLSearchParams(location.search).get("me");
    if (q === "1") localStorage.setItem("flyb-me", "1"); if (q === "0") localStorage.removeItem("flyb-me");
    return ["127.0.0.1", "localhost"].includes(location.hostname) || localStorage.getItem("flyb-me") === "1"; } catch (_) { return ["127.0.0.1", "localhost"].includes(location.hostname); } })();
  if (MINE) document.querySelectorAll(".ic.only-me").forEach(a => { a.hidden = false; });
  if (MINE) document.querySelectorAll(".ic.mine").forEach(a => { a.href = "http://127.0.0.1:8799/"; a.title = "진짜 배움 노트 (내 컴퓨터에서만)"; });
  document.querySelectorAll(".ic[data-win]").forEach(a => a.addEventListener("click", e => {
    if (e.metaKey || e.ctrlKey || e.shiftKey) return;
    e.preventDefault(); open(a);
  }));
  close.addEventListener("click", shut);
  shade.addEventListener("click", shut);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !win.hidden) shut(); });
})();
</script>
</body>
