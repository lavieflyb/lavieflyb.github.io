<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F1EFE0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ITINÉRAIRE">
<title>ITINÉRAIRE · flyb.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#F1EFE0; --paper:#F8F7EE; --ink:#36382B; --muted:#65684F; --line:#D8D6BF;
  --olive:#6E6A3A; --wine:#8C4A55; --wine-soft:#E4E6CC;
  --serif:"Gowun Batang","Noto Serif KR",serif; --sans:"Pretendard",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1B1C15; --paper:#23241C; --ink:#E9E7D5; --muted:#ADAC93; --line:#3A3B2F;
  --olive:#CFC58A; --wine:#D899A2; --wine-soft:#33352A; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding:max(28px,env(safe-area-inset-top,0px)) 16px max(48px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}
.top{display:flex;justify-content:space-between;align-items:baseline;font-size:.8rem;color:var(--muted)}
.top a{color:var(--muted);text-decoration:none}
header{border-bottom:2px solid var(--ink);padding-bottom:12px}
.kick{margin:0;font-size:.72rem;letter-spacing:.18em;color:var(--wine)}
h1{font-family:var(--serif);font-weight:400;font-size:2.2rem;letter-spacing:.04em;margin:2px 0 4px}
.sub{margin:0;color:var(--muted);font-size:.9rem;word-break:keep-all}
h2{font-family:var(--sans);font-size:.74rem;letter-spacing:.16em;color:var(--muted);font-weight:600;margin:0 0 6px}
.trip{display:grid;grid-template-columns:78px 1fr auto;gap:12px;align-items:baseline;padding:14px 0;border-bottom:1px dotted var(--line);text-decoration:none;color:inherit}
.trip:hover .t{color:var(--wine)}
.d{font-variant-numeric:tabular-nums;font-size:.82rem;color:var(--muted);line-height:1.35}
.t{font-family:var(--serif);font-size:1.25rem}
.t small{font-family:var(--sans);font-size:.78rem;color:var(--muted);margin-left:6px}
.s{font-size:.86rem;color:var(--muted);word-break:keep-all}
.inv{font-size:.78rem;color:var(--olive);margin-top:2px}
.chip{font-size:.72rem;padding:1px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.k-여행{color:var(--wine)} .k-출장{color:var(--olive)}
.now{background:var(--wine);color:var(--paper);border-color:var(--wine)}
.empty{color:var(--muted);font-size:.88rem;padding:10px 0}
.how{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px;font-size:.88rem;word-break:keep-all}
.how p{margin:0 0 6px}.how p:last-child{margin:0}
.how b{color:var(--wine)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="../index.html">← flyb.</a><a href="../archive.html?only=inventory">INVENTORY →</a></div>
  <header>
    <p class="kick">ITINÉRAIRE</p>
    <h1>떠나는 길</h1>
    <p class="sub">여행과 출장의 일정표. 떠나기 전에는 길잡이로 쓰고, 다녀온 뒤 남길 만한 곳은 INVENTORY의 기록이 돼요.</p>
  </header>
  <section><h2>다가오는 일정</h2><div id="up"></div></section>
  <section><h2>다녀온 일정</h2><div id="past"></div></section>
  <section class="how">
    <p><b>이렇게 이어져요</b> 일정표(ITINÉRAIRE) → 다녀옴 표시 → 남길 곳만 골라 INVENTORY 기록으로.</p>
    <p>일정 날짜 안에 쓴 INVENTORY 기록은 각 일정표 아래에 자동으로 모여요.</p>
  </section>
</div>
<script>
const fmt=s=>{const [y,m,d]=s.split("-").map(Number);return `${m}.${d}`;};
const today=new Date();today.setHours(0,0,0,0);
const asDate=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
Promise.all([
  fetch("trips.json",{cache:"no-store"}).then(r=>r.json()),
  fetch("../data/entries.json",{cache:"no-store"}).then(r=>r.json()).catch(()=>[])
]).then(([trips,entries])=>{
  trips.sort((a,b)=>a.start<b.start?1:-1);
  const up=document.getElementById("up"),past=document.getElementById("past");
  for(const t of trips){
    const s=asDate(t.start),e=asDate(t.end),isPast=e<today,isNow=s<=today&&today<=e;
    const inv=entries.filter(x=>x.date>=t.start&&x.date<=t.end);
    const a=document.createElement("a");a.className="trip";a.href=t.id+"/";
    const d=document.createElement("div");d.className="d";d.innerHTML=`${s.getFullYear()}<br>${fmt(t.start)}–${fmt(t.end)}`;
    const b=document.createElement("div");
    const ti=document.createElement("div");ti.className="t";ti.textContent=t.title;
    const sm=document.createElement("small");sm.textContent=t.place||"";ti.appendChild(sm);b.appendChild(ti);
    if(t.summary){const p=document.createElement("div");p.className="s";p.textContent=t.summary;b.appendChild(p);}
    if(inv.length){const p=document.createElement("div");p.className="inv";p.textContent=`INVENTORY 기록 ${inv.length}`;b.appendChild(p);}
    const c=document.createElement("span");c.className="chip "+(isNow?"now":"k-"+t.kind);c.textContent=isNow?"지금":t.kind;
    a.append(d,b,c);(isPast?past:up).appendChild(a);
  }
  for(const box of [up,past]) if(!box.children.length){const p=document.createElement("p");p.className="empty";p.textContent="아직 없어요.";box.appendChild(p);}
});
</script>
</body>
</html>
